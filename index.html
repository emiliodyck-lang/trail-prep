<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1320">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#f7f5f0; --card:#ffffff; --text:#1b1f2a; --muted:#727887; --line:#e3e1db; --danger:#e03131; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1320; --card:#182033; --text:#eef1f7; --muted:#8a93a8; --line:#263049; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.3 system-ui,-apple-system,sans-serif; overflow:hidden; }
  .app { height:100dvh; max-width:560px; margin:0 auto; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 16px 6px; }
  h1 { font-size:24px; margin:0; }
  .sub { color:var(--muted); font-size:14px; margin:2px 0 0; }
  .plus { flex:none; width:40px; height:40px; border-radius:50%; border:0; background:var(--text); color:var(--bg); font-size:26px; line-height:1; cursor:pointer; }

  .pages { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .pages::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; scroll-snap-align:start; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3, 1fr); gap:10px; padding:10px 16px; }
  .page.empty { display:grid; place-items:center; grid-template-rows:1fr; grid-template-columns:1fr; color:var(--muted); text-align:center; }
  .cell { container-type:size; display:grid; place-items:center; min-height:0; }
  .circle { --c:#888; width:min(100cqw, 100cqh); height:min(100cqw, 100cqh); border-radius:50%; border:3px solid var(--c);
    background:color-mix(in srgb, var(--c) 14%, var(--bg)); color:var(--text); cursor:pointer; padding:12%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-align:center;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; transition:transform .12s, background .15s; font:inherit; }
  .circle:active { transform:scale(.95); }
  .circle.done { background:var(--c); color:#fff; }
  .circle .n { font-weight:700; font-size:clamp(14px, 11cqmin, 22px); overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; word-break:break-word; }
  .circle .g, .circle .s { font-size:clamp(12px, 7cqmin, 15px); opacity:.8; }
  .circle .tick { font-size:clamp(16px, 12cqmin, 26px); line-height:1; }

  .dots { display:flex; justify-content:center; gap:6px; height:16px; align-items:center; }
  .dots span { width:7px; height:7px; border-radius:50%; background:var(--line); transition:background .15s, width .15s; }
  .dots span.on { background:var(--text); width:18px; border-radius:4px; }

  .search { padding:8px 16px calc(12px + env(safe-area-inset-bottom)); }
  input { width:100%; min-width:0; font:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); }

  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; z-index:10; }
  .sheet[hidden] { display:none; }
  .panel { width:100%; max-width:560px; margin:0 auto; background:var(--card); border-radius:20px 20px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); max-height:90dvh; overflow:auto; }
  .panel h2 { font-size:19px; margin:0 0 4px; }
  .panel .sub { margin-bottom:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .chip.sel { background:var(--text); border-color:var(--text); color:var(--bg); font-weight:600; }
  .field { display:block; color:var(--muted); font-size:14px; margin-bottom:16px; }
  .goal { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .unit { color:var(--text); font-weight:600; }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; padding:14px; font:inherit; font-weight:600; border-radius:12px; cursor:pointer; }
  .primary { border:0; background:var(--text); color:var(--bg); }
  .ghost { border:1px solid var(--line); background:none; color:var(--text); }
  .danger { border:0; background:none; color:var(--danger); }
  .days { display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; margin-bottom:18px; }
  .day { font:inherit; font-size:12px; padding:8px 0; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .day b { display:block; font-size:16px; }
  .day.on { background:var(--c); border-color:var(--c); color:#fff; }
  .links { margin-top:14px; text-align:center; font-size:13px; color:var(--muted); }
  .links button { background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="today">Today</h1><p class="sub" id="progress"></p></div>
    <button class="plus" id="add" aria-label="Add habit">+</button>
  </header>
  <div class="pages" id="pages"></div>
  <div class="dots" id="dots"></div>
  <div class="search"><input id="search" type="search" placeholder="Search habits" autocomplete="off"></div>
</div>
<input type="file" id="file" accept="application/json" hidden>
<div id="sheet" class="sheet" hidden><div class="panel"></div></div>
<script src="app.js"></script>
</body>
</html>
