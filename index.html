<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#15171c; --muted:#6b7280; --line:#e5e7eb; --done:#16a34a; --done-bg:#dcfce7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --text:#eceef2; --muted:#8b93a1; --line:#262a33; --done:#3ddc84; --done-bg:#12301f; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px calc(96px + env(safe-area-inset-bottom)); }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
  h1 { font-size:28px; margin:0; }
  #progress { color:var(--muted); font-variant-numeric:tabular-nums; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:16px; display:flex; align-items:center; gap:12px; padding:14px; user-select:none; }
  li.done { background:var(--done-bg); border-color:transparent; }
  .check { flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:none; display:grid; place-items:center; cursor:pointer; color:transparent; font-size:22px; }
  li.done .check { background:var(--done); border-color:var(--done); color:#fff; }
  .body { flex:1; min-width:0; cursor:pointer; }
  .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta { color:var(--muted); font-size:13px; display:flex; gap:10px; align-items:center; margin-top:4px; }
  .week { display:flex; gap:4px; }
  .dot { width:14px; height:14px; border-radius:4px; background:var(--line); border:0; padding:0; cursor:pointer; }
  .dot.on { background:var(--done); }
  .del { flex:none; background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; padding:6px; }
  form { position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--line); }
  form div { max-width:560px; margin:0 auto; display:flex; gap:8px; }
  input { flex:1; min-width:0; font:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button.add { font:inherit; font-weight:600; padding:0 18px; border-radius:12px; border:0; background:var(--text); color:var(--bg); cursor:pointer; }
  .check.plus { font-size:14px; font-weight:700; color:var(--text); }
  li.done .check.plus { color:#fff; }
  .amt { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .bar { flex:1; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--done); border-radius:3px; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; z-index:10; }
  .sheet[hidden] { display:none; }
  .panel { width:100%; max-width:560px; margin:0 auto; background:var(--card); border-radius:20px 20px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .panel h2 { font-size:19px; margin:0 0 14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .chip.sel { background:var(--done); border-color:var(--done); color:#fff; font-weight:600; }
  .field { display:block; color:var(--muted); font-size:14px; margin-bottom:16px; }
  .goal { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .goal input { flex:1; }
  .unit { color:var(--text); font-weight:600; }
  .big { font-size:34px; font-weight:700; margin:0 0 14px; font-variant-numeric:tabular-nums; }
  .big small { font-size:15px; color:var(--muted); font-weight:500; }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; padding:14px; }
  .ghost { font:inherit; border-radius:12px; border:1px solid var(--line); background:none; color:var(--text); cursor:pointer; }
  .empty { color:var(--muted); text-align:center; padding:48px 0; }
  footer { margin-top:24px; display:flex; gap:16px; justify-content:center; font-size:13px; }
  footer button { background:none; border:0; color:var(--muted); cursor:pointer; text-decoration:underline; font:inherit; }
</style>
</head>
<body>
<main>
  <header><h1 id="today">Today</h1><span id="progress"></span></header>
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>No habits yet. Add one below.</p>
  <footer>
    <button id="export">Export</button>
    <button id="import">Import</button>
    <input type="file" id="file" accept="application/json" hidden>
  </footer>
</main>
<form id="form" autocomplete="off">
  <div><input id="name" placeholder="New habit, e.g. Drink water" maxlength="60" required><button class="add">Add</button></div>
</form>
<div id="sheet" class="sheet" hidden><div class="panel"></div></div>
<script src="app.js"></script>
</body>
</html>
