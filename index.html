<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b7cfa">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#f7f5f0; --card:#ffffff; --text:#1b1f2a; --muted:#727887; --line:#e3e1db; --danger:#e03131; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1320; --card:#182033; --text:#eef1f7; --muted:#8a93a8; --line:#263049; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--g1); background-image:linear-gradient(170deg, var(--g1), var(--g2) 55%, var(--g3)); color:var(--text);
    font:16px/1.3 system-ui,-apple-system,sans-serif; overflow:hidden; transition:background .3s; }
  body { --g1:#5b7cfa; --g2:#9b5de5; --g3:#e05cb5; }
  .app { height:100dvh; max-width:560px; margin:0 auto; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); color:#fff; }
  header { display:flex; align-items:center; gap:10px; padding:18px 16px 6px; }
  header > div:first-child { flex:1; min-width:0; }
  h1 { font-size:24px; margin:0; }
  .sub { color:var(--muted); font-size:14px; margin:2px 0 0; }
  header .sub { color:rgba(255,255,255,.8); }
  .round { flex:none; width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.22); color:#fff; font-size:24px; line-height:1; cursor:pointer; }

  .pages { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .pages::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; scroll-snap-align:start; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3, 1fr); gap:8px 12px; padding:8px 16px; }
  .page.empty { place-items:center; grid-template-rows:1fr; grid-template-columns:1fr; color:rgba(255,255,255,.85); text-align:center; font-size:18px; }

  /* One habit: a ring with a big emoji (or initial), label underneath. */
  .habit { container-type:size; min-height:0; border:0; background:none; color:#fff; font:inherit; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .ring { --size:min(100cqw, calc(100cqh - 46px)); position:relative; width:var(--size); height:var(--size); border-radius:50%;
    background:rgba(255,255,255,.1); display:grid; place-items:center; transition:transform .12s, background .3s; }
  .habit:active .ring { transform:scale(.94); }
  .ring .e { font-size:calc(var(--size) * .42); line-height:1; filter:brightness(0) invert(1); }
  .ring .i { font-size:calc(var(--size) * .4); font-weight:800; line-height:1; }
  /* Slim progress ring: faint track, white arc that sweeps around when done. */
  .ring svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); overflow:visible; }
  .ring circle { fill:none; stroke-width:4; }
  .ring .track { stroke:rgba(255,255,255,.3); }
  /* Hidden when empty so the round cap doesn't leave a dot; stays visible while un-sweeping. */
  .ring .arc { stroke:#fff; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0;
    transition:stroke-dashoffset .6s cubic-bezier(.65,0,.35,1), opacity 0s .6s; }
  .habit.done .ring { background:rgba(255,255,255,.2); }
  .habit.done .ring .arc { stroke-dashoffset:0; opacity:1; transition:stroke-dashoffset .6s cubic-bezier(.65,0,.35,1), opacity 0s; }
  .ring .ok { position:absolute; right:4%; bottom:4%; width:calc(var(--size) * .24); height:calc(var(--size) * .24); min-width:22px; min-height:22px;
    border-radius:50%; background:#fff; color:var(--g2); font-weight:900; font-size:max(13px, calc(var(--size) * .14)); display:grid; place-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,.2); transform:scale(0); transition:transform .25s .45s cubic-bezier(.34,1.56,.64,1); }
  .habit.done .ring .ok { transform:scale(1); }
  .label { max-width:100%; text-align:center; }
  .label .n { font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:clamp(12px, 8cqw, 15px); line-height:1.15;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
  .label .g { font-size:12px; opacity:.85; white-space:nowrap; }

  .dots { display:flex; justify-content:center; gap:6px; height:16px; align-items:center; }
  .dots span { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.4); transition:background .15s, width .15s; }
  .dots span.on { background:#fff; width:18px; border-radius:4px; }

  .search { padding:8px 16px calc(12px + env(safe-area-inset-bottom)); }
  input { width:100%; min-width:0; font:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  .search input { background:rgba(255,255,255,.2); border-color:transparent; color:#fff; }
  .search input::placeholder { color:rgba(255,255,255,.75); }

  .themes { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin-bottom:18px; }
  .swatch { aspect-ratio:1; padding:0; border-radius:50%; border:3px solid transparent; background-origin:border-box; background-clip:padding-box; cursor:pointer; }
  .swatch.sel { border-color:var(--text); }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; z-index:10; }
  .sheet[hidden] { display:none; }
  .panel { width:100%; max-width:560px; margin:0 auto; background:var(--card); border-radius:20px 20px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); max-height:90dvh; overflow:auto; }
  .panel h2 { font-size:19px; margin:0 0 4px; }
  .panel .sub { margin-bottom:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .chip.sel { background:var(--text); border-color:var(--text); color:var(--bg); font-weight:600; }
  .chip.emo { font-size:22px; padding:6px 12px; line-height:1.2; }
  .emojis .own { width:110px; flex:none; padding:8px 12px; border-radius:999px; }
  .field { display:block; color:var(--muted); font-size:14px; margin-bottom:16px; }
  .goal { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .unit { color:var(--text); font-weight:600; }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; padding:14px; font:inherit; font-weight:600; border-radius:12px; cursor:pointer; }
  .primary { border:0; background:var(--text); color:var(--bg); }
  .ghost { border:1px solid var(--line); background:none; color:var(--text); }
  .danger { border:0; background:none; color:var(--danger); }
  .days { display:flex; gap:6px; overflow-x:auto; margin:0 -16px 18px; padding:0 16px 4px; scroll-snap-type:x proximity; scrollbar-width:none; }
  .days::-webkit-scrollbar { display:none; }
  .day { flex:0 0 50px; scroll-snap-align:end; font:inherit; font-size:12px; padding:6px 0 8px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .day i { display:block; height:14px; font-style:normal; font-size:11px; font-weight:700; color:var(--muted); }
  .day.on i { color:inherit; }
  .day b { display:block; font-size:16px; }
  .day.on { background:var(--c); border-color:var(--c); color:#fff; }
  .title-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  #edit-emoji { font-size:22px; }
  #edit-emoji:empty { display:none; }
  .title-input { flex:1; font-size:20px; font-weight:700; padding:6px 8px; margin-left:-8px; border-color:transparent; background:transparent; }
  .title-input:focus { border-color:var(--line); background:var(--bg); outline:none; }
  .pen { color:var(--muted); font-size:18px; pointer-events:none; }
  .links { margin-top:14px; text-align:center; font-size:13px; color:var(--muted); }
  .links button { background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="today">Today</h1><p class="sub" id="progress"></p></div>
    <button class="round" id="theme" aria-label="Change colors">🎨</button>
    <button class="round" id="add" aria-label="Add habit">+</button>
  </header>
  <div class="pages" id="pages"></div>
  <div class="dots" id="dots"></div>
  <div class="search"><input id="search" type="search" placeholder="Search habits" autocomplete="off"></div>
</div>
<input type="file" id="file" accept="application/json" hidden>
<div id="sheet" class="sheet" hidden><div class="panel"></div></div>
<script src="app.js"></script>
</body>
</html>
