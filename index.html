<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b7cfa">
<title>Habits</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<style>
  :root { --bg:#f7f5f0; --card:#ffffff; --text:#1b1f2a; --muted:#727887; --line:#e3e1db; --danger:#e03131; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1320; --card:#182033; --text:#eef1f7; --muted:#8a93a8; --line:#263049; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--g1); background-image:linear-gradient(170deg, var(--g1), var(--g2) 55%, var(--g3)); color:var(--text);
    font:16px/1.3 system-ui,-apple-system,sans-serif; overflow:hidden; transition:background .3s; }
  body { --g1:#5b7cfa; --g2:#9b5de5; --g3:#e05cb5; --fg:255,255,255; --sil:brightness(0) invert(1); }
  .app { height:100dvh; max-width:560px; margin:0 auto; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); color:rgb(var(--fg)); }
  header { display:flex; align-items:center; gap:10px; padding:18px 16px 6px; }
  header > div:first-child { flex:1; min-width:0; }
  h1 { font-size:24px; margin:0; }
  .sub { color:var(--muted); font-size:14px; margin:2px 0 0; }
  header .sub { color:rgba(var(--fg),.8); }
  .round { flex:none; width:40px; height:40px; border-radius:50%; border:0; background:rgba(var(--fg),.22); color:rgb(var(--fg)); font-size:24px; line-height:1; cursor:pointer; }

  .pages { flex:1; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .pages::-webkit-scrollbar { display:none; }
  .page { flex:0 0 100%; scroll-snap-align:start; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3, 1fr); gap:8px 12px; padding:8px 16px; }
  .page.empty { place-items:center; grid-template-rows:1fr; grid-template-columns:1fr; color:rgba(var(--fg),.85); text-align:center; font-size:18px; }

  /* One habit: a ring with a big emoji (or initial), label underneath. */
  .habit { container-type:size; min-height:0; border:0; background:none; color:rgb(var(--fg)); font:inherit; padding:0; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .ring { --size:min(100cqw, calc(100cqh - 46px)); position:relative; width:var(--size); height:var(--size); border-radius:50%;
    background:rgba(var(--fg),.1); display:grid; place-items:center; transition:transform .12s, background .3s; }
  .habit:active .ring { transform:scale(.94); }
  .ring .e { font-size:calc(var(--size) * .42); line-height:1; filter:var(--sil); }
  .ring .i { font-size:calc(var(--size) * .4); font-weight:800; line-height:1; }
  .ic { display:grid; place-items:center; color:rgb(var(--fg)); }
  .ic svg { display:block; width:100%; height:100%; }
  .ring .ic { width:calc(var(--size) * .46); height:calc(var(--size) * .46); }
  /* Slim progress ring: faint track, white arc that sweeps around when done. */
  .ring svg.prog { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); overflow:visible; }
  .ring circle { fill:none; stroke-width:4; }
  .ring .track { stroke:rgba(var(--fg),.3); }
  /* Hidden when empty so the round cap doesn't leave a dot; stays visible while un-sweeping. */
  .ring .arc { stroke:rgb(var(--fg)); stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100; opacity:0;
    transition:stroke-dashoffset .6s cubic-bezier(.65,0,.35,1), opacity 0s .6s; }
  .habit.done .ring { background:rgba(var(--fg),.2); }
  .habit.done .ring .arc { stroke-dashoffset:0; opacity:1; transition:stroke-dashoffset .6s cubic-bezier(.65,0,.35,1), opacity 0s; }
  .ring .ok { position:absolute; right:4%; bottom:4%; width:calc(var(--size) * .24); height:calc(var(--size) * .24); min-width:22px; min-height:22px;
    border-radius:50%; background:rgb(var(--fg)); color:var(--g2); font-weight:900; font-size:max(13px, calc(var(--size) * .14)); display:grid; place-items:center;
    box-shadow:0 2px 6px rgba(0,0,0,.2); transform:scale(0); transition:transform .25s .45s cubic-bezier(.34,1.56,.64,1); }
  .habit.done .ring .ok { transform:scale(1); }
  .label { max-width:100%; text-align:center; }
  .label .n { font-weight:800; text-transform:uppercase; letter-spacing:.02em; font-size:clamp(12px, 8cqw, 15px); line-height:1.15;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow-wrap:anywhere; }
  .label .g { font-size:12px; opacity:.85; white-space:nowrap; }

  .dots { display:flex; justify-content:center; gap:6px; height:16px; align-items:center; }
  .dots span { width:7px; height:7px; border-radius:50%; background:rgba(var(--fg),.4); transition:background .15s, width .15s; }
  .dots span.on { background:rgb(var(--fg)); width:18px; border-radius:4px; }

  input { width:100%; min-width:0; font:inherit; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  .bottom { display:flex; justify-content:center; padding:8px 16px calc(12px + env(safe-area-inset-bottom)); }
  .pill { font:inherit; font-weight:700; color:rgb(var(--fg)); background:rgba(var(--fg),.22); border:0; border-radius:999px; padding:12px 22px; cursor:pointer; }

  /* Stats: its own full screen over the same gradient. */
  #stats { position:fixed; inset:0; z-index:5; overflow-y:auto; color:rgb(var(--fg)); background:inherit; background-attachment:fixed;
    padding:calc(14px + env(safe-area-inset-top)) 0 calc(28px + env(safe-area-inset-bottom)); }
  #stats[hidden] { display:none; }
  .stats-in { max-width:560px; margin:0 auto; padding:0 16px; }
  .stats-top { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .stats-top .round { font-size:30px; line-height:36px; }
  .stats-top h1 { flex:1; }
  .range select { font:inherit; font-size:15px; font-weight:700; color:rgb(var(--fg)); background:rgba(var(--fg),.22);
    border:0; border-radius:999px; padding:9px 30px 9px 14px; appearance:none; -webkit-appearance:none; cursor:pointer; }
  .range { position:relative; }
  .range::after { content:'▾'; position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; font-size:13px; }
  .range option { color:#000; }
  .stats-empty { opacity:.85; font-size:18px; text-align:center; margin-top:40px; }

  .carousel { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; max-width:560px; margin:0 auto; }
  .carousel::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100%; scroll-snap-align:center; height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  .slide-name { font-weight:800; text-transform:uppercase; letter-spacing:.03em; font-size:15px; max-width:80%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini, .big { display:grid; place-items:center; border-radius:50%; border:3px solid rgba(var(--fg),.6); background:rgba(var(--fg),.12); flex:none; }
  .mini { width:52px; height:52px; margin:0 6px; }
  .big { width:100px; height:100px; border-width:4px; }
  .mini .e, .big .e { filter:var(--sil); line-height:1; }
  .mini .e { font-size:24px; } .big .e { font-size:46px; }
  .mini .i { font-size:22px; font-weight:800; } .big .i { font-size:42px; font-weight:800; }
  .mini .ic { width:26px; height:26px; } .big .ic { width:50px; height:50px; }
  .nk .wi { display:inline-block; width:13px; height:13px; vertical-align:-2px; margin-right:4px; }
  .nk .wi svg { width:100%; height:100%; }
  /* Show at most 5; with more, the row drifts and fades in/out at the edges. */
  .minis { max-width:320px; overflow:hidden; }
  .minis .track { display:flex; justify-content:center; }
  .minis.drift { -webkit-mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image:linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  .minis.drift .track { justify-content:flex-start; width:max-content; animation:drift calc(var(--n) * 2.6s) linear infinite; }
  @keyframes drift { to { transform:translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .minis.drift .track { animation:none; } }
  .sdots { margin-top:2px; }

  .sep { border:0; border-top:1px solid rgba(var(--fg),.25); margin:16px 0; }
  .range-note { font-size:13px; opacity:.8; margin:0 0 6px; }
  .nums { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px 8px; }
  .num { min-width:0; }
  .nv { font-size:clamp(26px, 8.5vw, 34px); font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .nk .who { display:block; text-transform:none; letter-spacing:0; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .nv small { font-size:18px; font-weight:700; opacity:.75; }
  .nk { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; opacity:.8; margin-top:4px; overflow:hidden; text-overflow:ellipsis; }
  #stats h3 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; opacity:.85; margin:0 0 8px; }
  .readout { font-size:13px; min-height:18px; margin-bottom:8px; font-variant-numeric:tabular-nums; }

  .lplot, .plot { position:relative; height:150px; padding-left:34px; }
  .lplot { padding-bottom:0; }
  .grid { position:absolute; left:0; right:0; top:0; bottom:18px; display:flex; flex-direction:column; justify-content:space-between; pointer-events:none; }
  .lplot .grid { bottom:0; }
  .grid span { font-size:10px; opacity:.7; border-top:1px solid rgba(var(--fg),.18); line-height:0; }
  .lsvg { position:relative; height:100%; touch-action:pan-y; cursor:crosshair; }
  .lsvg svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .xhair { position:absolute; top:0; bottom:0; width:0; border-left:1px dashed rgba(var(--fg),.7); pointer-events:none; }
  .xdot { position:absolute; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:rgb(var(--fg)); box-shadow:0 0 0 3px rgba(var(--fg),.35); pointer-events:none; }
  .xlabels { display:flex; justify-content:space-between; padding-left:34px; font-size:11px; opacity:.8; margin-top:6px; }
  .noy .lplot, .noy .xlabels { padding-left:0; }
  /* Day-of-week bars and time-of-day line side by side. */
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .duo > div { min-width:0; }
  .duo .readout { min-height:34px; font-size:12px; }
  .duo .plot, .duo .lplot { height:120px; }
  .duo .plot { padding-left:28px; }
  .duo .note { font-size:12px; }

  .bars { position:relative; height:100%; display:flex; gap:2px; align-items:stretch; }
  .bar { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-end; border:0; background:none; padding:0 0 18px; cursor:pointer; position:relative; }
  .bar .fill { display:block; width:100%; max-width:22px; margin:0 auto; background:rgba(var(--fg),.9); border-radius:4px 4px 0 0; }
  .bar .fill.none { height:2px !important; background:rgba(var(--fg),.25); border-radius:1px; }
  .bar.on .fill { background:rgb(var(--fg)); box-shadow:0 0 0 2px rgba(var(--fg),.35); }
  .bar .tick { position:absolute; bottom:0; left:50%; transform:translateX(-50%); font-size:10px; opacity:.8; white-space:nowrap; color:rgb(var(--fg)); }
  .note { font-size:14px; opacity:.9; margin-top:10px; }
  .themes { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin-bottom:18px; }
  .swatch.light { box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
  .swatch { aspect-ratio:1; padding:0; border:0; border-radius:50%; cursor:pointer; -webkit-appearance:none; appearance:none; }
  .swatch.sel { outline:3px solid var(--text); outline-offset:3px; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; z-index:10; }
  .sheet[hidden] { display:none; }
  .panel { width:100%; max-width:560px; margin:0 auto; background:var(--card); border-radius:20px 20px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); max-height:90dvh; overflow:auto; }
  .panel h2 { font-size:19px; margin:0 0 4px; }
  .panel .sub { margin-bottom:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .chip.sel { background:var(--text); border-color:var(--text); color:var(--bg); font-weight:600; }
  .chip.ico { width:48px; height:44px; padding:0; display:grid; place-items:center; }
  .chip.ico svg { width:24px; height:24px; }
  .icon-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(46px, 1fr)); gap:6px; max-height:220px; overflow-y:auto; margin:-6px 0 16px; padding:2px; }
  .icon-grid .chip.ico { width:auto; height:44px; border-radius:12px; }
  .own-row .own { margin-top:6px; }
  .field { display:block; color:var(--muted); font-size:14px; margin-bottom:16px; }
  .goal { display:flex; gap:8px; align-items:center; margin-top:6px; }
  .unit { color:var(--text); font-weight:600; }
  .actions { display:flex; gap:8px; }
  .actions button { flex:1; padding:14px; font:inherit; font-weight:600; border-radius:12px; cursor:pointer; }
  .primary { border:0; background:var(--text); color:var(--bg); }
  .ghost { border:1px solid var(--line); background:none; color:var(--text); }
  .danger { border:0; background:none; color:var(--danger); }
  .days { display:flex; gap:6px; overflow-x:auto; margin:0 -16px 18px; padding:0 16px 4px; scroll-snap-type:x proximity; scrollbar-width:none; }
  .days::-webkit-scrollbar { display:none; }
  .day { flex:0 0 50px; scroll-snap-align:end; font:inherit; font-size:12px; padding:6px 0 8px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
  .day i { display:block; height:14px; font-style:normal; font-size:11px; font-weight:700; color:var(--muted); }
  .day.on i { color:inherit; }
  .day b { display:block; font-size:16px; }
  .day.on { background:var(--c); border-color:var(--c); color:#fff; }
  .title-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  #edit-emoji { font-size:22px; width:28px; height:28px; display:grid; place-items:center; }
  #edit-emoji .ic, #edit-emoji .ic svg { width:26px; height:26px; color:var(--text); }
  #edit-emoji .e { filter:none; }
  #edit-emoji:empty { display:none; }
  .title-input { flex:1; font-size:20px; font-weight:700; padding:6px 8px; margin-left:-8px; border-color:transparent; background:transparent; }
  .title-input:focus { border-color:var(--line); background:var(--bg); outline:none; }
  .pen { color:var(--muted); font-size:18px; pointer-events:none; }
  .links { margin-top:14px; text-align:center; font-size:13px; color:var(--muted); }
  .links button { background:none; border:0; color:var(--muted); text-decoration:underline; font:inherit; cursor:pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="today">Today</h1><p class="sub" id="progress"></p></div>
    <button class="round" id="theme" aria-label="Change colors">🎨</button>
    <button class="round" id="add" aria-label="Add habit">+</button>
  </header>
  <div class="pages" id="pages"></div>
  <div class="dots" id="dots"></div>
  <div class="bottom"><button class="pill" id="stats-btn">📊 Stats</button></div>
</div>
<input type="file" id="file" accept="application/json" hidden>
<div id="stats" hidden></div>
<div id="sheet" class="sheet" hidden><div class="panel"></div></div>
<script src="icons.js?v=18"></script>
<script src="app.js?v=18"></script>
</body>
</html>
